ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/PWD-Application-System/public

    <Directory /var/www/html/PWD-Application-System/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/PWD-Application-System>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>